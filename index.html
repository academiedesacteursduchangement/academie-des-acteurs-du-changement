<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Académie des acteurs du changement</title>

    <meta name="description" content="Académie des acteurs du changement — Former • Inspirer • Transformer">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
        }

        .logo {
            width: 180px;
            max-width: 60%;
            height: auto;
        }

        h1 {
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .slogan {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .intro {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .meet-button {
            display: inline-block;
            padding: 15px 30px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .meet-button:hover {
            background: #1558b0;
        }

        footer {
            margin-top: 45px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <main class="container">

        <img 
            class="logo"
            src="https://raw.githubusercontent.com/academieduchangement/academie-du-changement/main/logo%205.png"
            alt="Logo de l'Académie des acteurs du changement"
        >

        <h1>Académie des acteurs du changement</h1>

        <p class="slogan">
            Former • Inspirer • Transformer
        </p>

        <p class="intro">
            Bienvenue dans notre espace de formation en ligne.
        </p>

        <a 
            class="meet-button"
            href="https://meet.google.com/xcw-vaui-kmw"
            target="_blank"
            rel="noopener noreferrer"
        >
            🎥 Rejoindre la réunion
        </a>

        <footer>
            © 2026 Académie des acteurs du changement
        </footer>

    </main>

</body>
</html>
